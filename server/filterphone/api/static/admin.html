<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FilterPhone — ניהול</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/admin.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand big"><span class="logo" aria-hidden="true"></span><span>FilterPhone</span></div>
      <p class="muted">כניסת מנהל</p>
      <label>שם משתמש<input name="username" autocomplete="username" required></label>
      <label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">כניסה</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <div id="app" class="shell" hidden>
    <aside class="side" id="side">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span>FilterPhone</span></div>
      <nav id="nav" aria-label="ניווט ראשי">
        <a href="#/overview" data-route="overview"><span class="ico ico-home"></span>סקירה</a>
        <a href="#/requests" data-route="requests"><span class="ico ico-inbox"></span>בקשות<b class="badge" id="badge-requests" hidden></b></a>
        <a href="#/support" data-route="support"><span class="ico ico-chat"></span>תמיכה<b class="badge" id="badge-support" hidden></b></a>
        <a href="#/wabot" data-route="wabot"><span class="ico ico-chat"></span>בוט וואטסאפ</a>
        <a href="#/devices" data-route="devices"><span class="ico ico-phone"></span>מכשירים</a>
        <a href="#/customers" data-route="customers"><span class="ico ico-people"></span>לקוחות</a>
        <a href="#/profiles" data-route="profiles"><span class="ico ico-list"></span>פרופילים</a>
        <a href="#/apps" data-route="apps"><span class="ico ico-phone"></span>חנות אפליקציות</a>
        <a href="#/events" data-route="events"><span class="ico ico-list"></span>חסימות אחרונות</a>
        <a href="#/test" data-route="test"><span class="ico ico-eye"></span>בדיקת תמונה</a>
        <a href="#/codes" data-route="codes"><span class="ico ico-key"></span>קודי הפעלה</a>
        <a href="#/audit" data-route="audit"><span class="ico ico-clock"></span>יומן פעולות</a>
        <a href="#/system" data-route="system"><span class="ico ico-gear"></span>מערכת</a>
      </nav>
      <div class="side-foot">
        <span class="muted" id="whoami"></span>
        <button id="logout" class="ghost small">יציאה</button>
      </div>
    </aside>
    <header class="topbar">
      <button id="menu" class="ghost icon-btn" aria-label="תפריט"><span class="ico ico-menu"></span></button>
      <h1 id="title"></h1>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="row end gap">
        <button value="ok" class="primary" id="dialog-ok">אישור</button>
        <button value="cancel" class="ghost" id="dialog-cancel">ביטול</button>
      </div>
    </form>
  </dialog>
</body>
</html>
