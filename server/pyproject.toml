[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filterphone"
version = "2.0.0"
description = "FilterPhone — שרת סינון: מנוע תמונות (SigLIP2 + NudeNet), תוסף mitmproxy ו-API למכשירים"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy==12.2.1",
    "onnxruntime>=1.22",
    "numpy>=2.0",
    "pillow>=11.3",
    "redis[hiredis]>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.23", "ruff>=0.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["filterphone*"]

[tool.setuptools.package-data]
filterphone = ["engine/heads.json", "proxy/passthrough.txt", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"../tools/*" = ["E702", "E741"]
