name: אפליקציה — אנדרואיד

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: בדיקות ובניית APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: תלויות
        run: flutter pub get --enforce-lockfile

      - name: ניתוח סטטי
        run: flutter analyze

      - name: בדיקות (Flutter)
        run: flutter test

      - name: מפתח חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: בניית APK
        run: |
          V=1.0.${{ github.run_number }}
          ARGS="--release --build-number=${{ github.run_number }} --build-name=$V"
          mkdir -p ../dist
          # גרסה לכל המעבדים (גיבוי) + גרסה קלה ל-arm64 (כמעט כל הטלפונים)
          flutter build apk $ARGS
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/FilterPhone-$V-universal.apk
          flutter build apk $ARGS --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/FilterPhone-$V-arm64.apk

      # בדיקות היחידה של הקוד הנייטיבי (מדיניות, זיהוי תמונות פרופיל, השהיות, עדכון עצמי) + lint.
      # אחרי הבנייה: היא יוצרת את gradlew ואת local.properties
      - name: בדיקות ו-lint (Kotlin)
        working-directory: app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: בדיקת ה-APK (הרשאות, רכיבים, לא debuggable) + FilterPhone.json
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          python3 ../tools/apk_release.py --aapt2 "$AAPT2" ../dist

      - name: אימות חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in ../dist/*.apk; do
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -q "CN=FilterPhone" || { echo "$apk לא חתום במפתח של FilterPhone"; exit 1; }
            echo "✓ $(basename "$apk") — $(echo "$out" | grep -m1 'certificate SHA-256')"
          done
          ls -lh ../dist

      - name: ניקוי סודות
        if: always()
        run: rm -f android/upload.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: FilterPhone-APK
          path: |
            dist/*.apk
            dist/FilterPhone.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/app/reports/
            app/build/app/test-results/
          retention-days: 14
