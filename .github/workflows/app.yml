name: אפליקציה — אנדרואיד

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  # הפעלה ידנית: בדיקות + APK חתום. "release" — גם פרסום ב-GitHub Releases (בלי commit לאפליקציה)
  workflow_dispatch:
    inputs:
      release:
        description: "לפרסם את ה-APK ב-GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: בדיקות ובניית APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: תלויות
        run: flutter pub get --enforce-lockfile

      - name: ניתוח סטטי
        run: flutter analyze

      - name: בדיקות (Flutter)
        run: flutter test

      - name: מפתח חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: בניית APK
        run: |
          V=1.0.${{ github.run_number }}
          # versionCode מעל טווח ה-arm64 הישן (2xxx), כדי שגם טלפון שנשאר על גרסה ישנה יתעדכן.
          CODE=$(( 3000 + ${{ github.run_number }} ))
          mkdir -p ../dist
          # 1. אוניברסלי (כל המעבדים) — הקמה ב-QR וטלפונים של 32 ביט
          flutter build apk --release --build-number=$CODE --build-name=$V
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/FilterPhone-$V-universal.apk
          # 2. קל — arm64 בלבד (רוב הטלפונים). בפיצול Flutter מוסיף 2000 ל-versionCode של arm64, ולכן
          #    בונים עם CODE-2000: שני הקבצים יוצאים עם אותו versionCode (apk_release.py מוודא), וכך אפשר
          #    לעבור ביניהם לשני הכיוונים בגרסה הבאה — בלי טווחי קודים ובלי טלפון "תקוע".
          flutter build apk --release --build-number=$(( CODE - 2000 )) --build-name=$V \
            --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/FilterPhone-$V-arm64.apk
          # הבניות משאירות Gradle daemon (‎-Xmx8G) ו-Kotlin daemon. בלי לעצור אותם, שלב הבדיקות (עוד JVM
          # של 8GB) מכלה את הזיכרון של המכונה — והיא נתקעת עד שאפילו ביטול לא עובד
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true

      # בדיקות היחידה של הקוד הנייטיבי (מדיניות, זיהוי תמונות פרופיל, השהיות, עדכון עצמי) + lint.
      # אחרי הבנייה: היא יוצרת את gradlew ואת local.properties
      - name: בדיקות ו-lint (Kotlin)
        working-directory: app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: בדיקת ה-APK (הרשאות, רכיבים, לא debuggable) + FilterPhone.json
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          python3 ../tools/apk_release.py --aapt2 "$AAPT2" ../dist

      - name: אימות חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in ../dist/*.apk; do
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -q "CN=FilterPhone" || { echo "$apk לא חתום במפתח של FilterPhone"; exit 1; }
            echo "✓ $(basename "$apk") — $(echo "$out" | grep -m1 'certificate SHA-256')"
          done
          ls -lh ../dist

      - name: פרסום APK לבדיקה ב-GitHub Releases
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-release]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="test-v1.0.${{ github.run_number }}"
          gh release create "$TAG" ../dist/*.apk ../dist/FilterPhone.json \
            --title "FilterPhone Test ${{ github.run_number }}" \
            --notes "בדיקת APK חתום. נבנה מ-commit ${GITHUB_SHA}. אין כאן פריסת שרת." \
            --prerelease --target "$GITHUB_SHA"

      - name: ניקוי סודות
        if: always()
        run: rm -f android/upload.jks android/key.properties

      # פרסום בדיקה: [test-release] בהודעת commit, או הפעלה ידנית עם release; אינו פורס שרת.
      # תוצר ה-APK הוא מטמון נוחות בלבד. פריסת production בונה APK חתום מחדש
      # ישירות ב-deploy.yml, כדי שכשל במכסת Artifacts לא ימנע עדכון לשרת.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: FilterPhone-APK
          path: |
            dist/*.apk
            dist/FilterPhone.json
          retention-days: 14
