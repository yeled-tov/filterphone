name: אפליקציה — אנדרואיד

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: בדיקות ובניית APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: תלויות
        run: flutter pub get --enforce-lockfile

      - name: ניתוח סטטי
        run: flutter analyze

      - name: בדיקות
        run: flutter test

      - name: מפתח חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: בניית APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/FilterPhone-1.0.${{ github.run_number }}.apk

      - name: אימות חתימה
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          out=$("$APKSIGNER" verify --verbose --print-certs ../dist/*.apk 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -iE "verified using|certificate (DN|SHA-256)" || echo "$out"
          echo "$out" | grep -q "CN=FilterPhone" || { echo "ה-APK לא חתום במפתח של FilterPhone"; exit 1; }
          ls -lh ../dist

      - name: ניקוי סודות
        if: always()
        run: rm -f android/upload.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: FilterPhone-APK
          path: dist/*.apk
          retention-days: 30
