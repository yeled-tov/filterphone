name: העלאה לשרת

# הפעלה ידנית בלבד: בנה ופרסם את הגרסה שאומתה ל-main. אינו תלוי ב-Action Artifacts.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "מה לעשות"
        type: choice
        options: [both, server, apk, status, rollback, wabot, devices, net, images, legacy-bot-start, legacy-bot-stop, legacy-bot-logs]
        default: both
      backup:
        description: "לחזרה לאחור בלבד: שם תיקיית הגיבוי, למשל 20261005-213000"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER: ubuntu@151.145.88.42
  PUBLIC: https://api.filterphone.com

jobs:
  deploy:
    name: ${{ inputs.what }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: מפתח ההעלאה
        env:
          KEY: ${{ secrets.FP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FP_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::חסרים הסודות FP_DEPLOY_KEY / FP_DEPLOY_KNOWN_HOSTS — ראו docs/DEPLOY_PROMPT.md שלב 7"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - uses: actions/checkout@v4
        if: inputs.what == 'both' || inputs.what == 'server' || inputs.what == 'apk'

      - name: לפני
        run: ssh -o BatchMode=yes "$SERVER" status

      # חייבת להיות בניית app.yml מוצלחת לאותו commit. משתמשים במספר הבנייה שלה,
      # כדי ש-versionCode יהיה גדול מספיק לעדכון APK קיים בטלפון.
      - name: אימות בניית האפליקציה ל-commit הנוכחי
        if: inputs.what == 'both' || inputs.what == 'apk'
        id: app_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow app.yml --branch main --status success \
                  --limit 1 --json number,headSha,url)
          sha=$(jq -r '.[0].headSha // empty' <<< "$row")
          number=$(jq -r '.[0].number // empty' <<< "$row")
          url=$(jq -r '.[0].url // empty' <<< "$row")
          if [ -z "$number" ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::אין בדיקות אפליקציה מוצלחות ל-commit הנוכחי. המתן לסיום app.yml ב-main ואז נסה שוב."
            echo "Current: $GITHUB_SHA; latest successful app build: ${sha:-none} ($url)"
            exit 1
          fi
          echo "build_number=$number" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$number" >> "$GITHUB_OUTPUT"
          echo "Verified app build $number for $sha"

      - uses: actions/setup-java@v4
        if: inputs.what == 'both' || inputs.what == 'apk'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: inputs.what == 'both' || inputs.what == 'apk'
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: תלויות Flutter
        if: inputs.what == 'both' || inputs.what == 'apk'
        run: cd app && flutter pub get --enforce-lockfile

      - name: בניית APK חתום
        if: inputs.what == 'both' || inputs.what == 'apk'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}
          VERSION_NAME: ${{ steps.app_version.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::חסרים סודות חתימת Android (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > app/android/key.properties

          cd app
          mkdir -p dist
          # versionCode מעל טווח ה-arm64 הישן (2xxx), כדי שגם טלפון שנשאר על גרסה ישנה יתעדכן.
          CODE=$(( 3000 + BUILD_NUMBER ))
          # 1. אוניברסלי (כל המעבדים) — הקמה ב-QR וטלפונים של 32 ביט
          flutter build apk --release --build-number=$CODE --build-name=$VERSION_NAME
          cp build/app/outputs/flutter-apk/app-release.apk "dist/FilterPhone-$VERSION_NAME-universal.apk"
          # 2. קל — arm64 בלבד, אותו versionCode (Flutter מוסיף 2000 בפיצול של arm64; apk_release.py מוודא)
          flutter build apk --release --build-number=$(( CODE - 2000 )) --build-name=$VERSION_NAME \
            --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/FilterPhone-$VERSION_NAME-arm64.apk"
          # הבניות משאירות Gradle daemon (‎-Xmx8G) ו-Kotlin daemon — עוצרים לפני שלב הבדיקות (אחרת אין זיכרון)
          (cd android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true

      - name: בדיקות ו-lint (Kotlin)
        if: inputs.what == 'both' || inputs.what == 'apk'
        run: cd app/android && ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: בדיקת APK ויצירת FilterPhone.json
        if: inputs.what == 'both' || inputs.what == 'apk'
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          cd app
          python3 ../tools/apk_release.py --aapt2 "$AAPT2" dist

      - name: אימות חתימת APK
        if: inputs.what == 'both' || inputs.what == 'apk'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/dist/*.apk; do
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -q "CN=FilterPhone" || { echo "$apk לא חתום במפתח של FilterPhone"; exit 1; }
            echo "✓ $(basename "$apk") — חתימה תקינה"
          done

      - name: העלאת השרת
        if: inputs.what == 'both' || inputs.what == 'server'
        run: |
          tar -czf - --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' server tools deploy \
            | ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" "deploy ${GITHUB_SHA::7}"

      - name: בדיקות אחרי ההעלאה
        if: inputs.what == 'both' || inputs.what == 'server'
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$PUBLIC/health"
          curl -fsS "$PUBLIC/v1/catalog" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["levels"] and d["options"]; print("catalog:", len(d["options"]), "options")'

      - name: פרסום האפליקציה
        if: inputs.what == 'both' || inputs.what == 'apk'
        run: |
          # FilterPhone.apk = הקל (arm64, רוב הטלפונים — הורדה ראשית ועדכון עצמי);
          # FilterPhone-universal.apk = כל המעבדים (הקמת Device Owner ב-QR, טלפונים של 32 ביט).
          # שניהם באותו versionCode; FilterPhone.json מפרט את המעבדים של כל אחד — כל טלפון לוקח את שלו.
          cp app/dist/*-arm64.apk FilterPhone.apk
          cp app/dist/*-universal.apk FilterPhone-universal.apk
          cp app/dist/FilterPhone.json .
          echo "מפרסם את הגרסה ${{ steps.app_version.outputs.version }} שנבנתה ונחתמה ב-workflow הזה"
          tar -cf - FilterPhone.apk FilterPhone-universal.apk FilterPhone.json | ssh -o BatchMode=yes "$SERVER" apk
          curl -fsSI "$PUBLIC/download/FilterPhone.apk" | head -1

      - name: חזרה לגרסה הקודמת
        if: inputs.what == 'rollback'
        env:
          BACKUP: ${{ inputs.backup }}
        run: ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" "rollback $BACKUP"

      - name: בוט הוואטסאפ — אבחון
        if: inputs.what == 'wabot'
        run: ssh -o BatchMode=yes "$SERVER" wabot

      - name: מכשירים — אבחון (VPN, דיווחים, שגיאות שרת)
        if: inputs.what == 'devices'
        run: ssh -o BatchMode=yes "$SERVER" devices

      - name: שרשרת התעבורה — אבחון (DNS, פרוקסי, NAT, תעבורה לכל מכשיר)
        if: inputs.what == 'net'
        run: ssh -o BatchMode=yes "$SERVER" net

      - name: סינון תמונות — אבחון (מדדים, סיבות, מקומי מול GPU)
        if: inputs.what == 'images'
        run: ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" images

      - name: הבוט הישן (pm2)
        if: startsWith(inputs.what, 'legacy-bot-')
        env:
          WHAT: ${{ inputs.what }}
        run: ssh -o BatchMode=yes "$SERVER" "legacy-bot ${WHAT#legacy-bot-}"

      - name: ניקוי מפתח החתימה
        if: always()
        run: rm -f app/android/upload.jks app/android/key.properties

      - name: אחרי
        if: always()
        run: ssh -o BatchMode=yes "$SERVER" status || true

      - name: ניקוי מפתח ההעלאה
        if: always()
        run: rm -f ~/.ssh/id_ed25519
