name: העלאה לשרת

# הפעלה ידנית בלבד (Actions → "העלאה לשרת" → Run). דורש הגדרה חד-פעמית של מפתח העלאה —
# ראו docs/DEPLOY_PROMPT.md, שלב 7. המפתח מוגבל בשרת לפקודות של deploy/ci_deploy.sh בלבד.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "מה לעשות"
        type: choice
        options: [both, server, apk, status, rollback]
        default: both
      backup:
        description: "לחזרה לאחור בלבד: שם תיקיית הגיבוי, למשל 20261005-213000"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER: ubuntu@151.145.88.42
  PUBLIC: https://api.filterphone.com

jobs:
  deploy:
    name: ${{ inputs.what }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: מפתח ההעלאה
        env:
          KEY: ${{ secrets.FP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FP_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::חסרים הסודות FP_DEPLOY_KEY / FP_DEPLOY_KNOWN_HOSTS — ראו docs/DEPLOY_PROMPT.md שלב 7"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - uses: actions/checkout@v4
        if: inputs.what == 'both' || inputs.what == 'server'

      - name: לפני
        run: ssh -o BatchMode=yes "$SERVER" status

      - name: העלאת השרת
        if: inputs.what == 'both' || inputs.what == 'server'
        run: |
          tar -czf - --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' server tools deploy \
            | ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" "deploy ${GITHUB_SHA::7}"

      - name: בדיקות אחרי ההעלאה
        if: inputs.what == 'both' || inputs.what == 'server'
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$PUBLIC/health"
          curl -fsS "$PUBLIC/v1/catalog" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["levels"] and d["options"]; print("catalog:", len(d["options"]), "options")'

      - name: פרסום האפליקציה
        if: inputs.what == 'both' || inputs.what == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow app.yml --branch "$GITHUB_REF_NAME" --status success \
                     --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$run_id" ] || { echo "::error::אין בנייה מוצלחת של האפליקציה בענף $GITHUB_REF_NAME"; exit 1; }
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n FilterPhone-APK -D apk
          cp apk/*-arm64.apk FilterPhone.apk
          cp apk/*-universal.apk FilterPhone-universal.apk
          files="FilterPhone.apk FilterPhone-universal.apk"
          # הגרסה והטביעות — מהן השרת מציע עדכון לטלפונים (בבניות ישנות אין את הקובץ)
          if [ -f apk/FilterPhone.json ]; then cp apk/FilterPhone.json .; files="$files FilterPhone.json"; fi
          echo "מפרסם את הבנייה $run_id: $(ls apk)"
          tar -cf - $files | ssh -o BatchMode=yes "$SERVER" apk
          curl -fsSI "$PUBLIC/download/FilterPhone.apk" | head -1

      - name: חזרה לגרסה הקודמת
        if: inputs.what == 'rollback'
        env:
          BACKUP: ${{ inputs.backup }}
        run: ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" "rollback $BACKUP"

      - name: אחרי
        if: always()
        run: ssh -o BatchMode=yes "$SERVER" status || true

      - name: ניקוי המפתח
        if: always()
        run: rm -f ~/.ssh/id_ed25519
