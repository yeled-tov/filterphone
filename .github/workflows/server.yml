name: שרת — בדיקות

on:
  push:
    branches: [main]
    paths: ["server/**", "tools/**", "deploy/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "tools/**", "deploy/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: בדיקות יחידה ואיכות קוד
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: התקנה
        run: pip install -e "server[dev]"
      - name: ruff
        run: |
          ruff check server/filterphone server/tests
          ruff check tools --config server/pyproject.toml --ignore E702,E741
      - name: pytest
        run: pytest -q server/tests
      - name: בדיקת תחביר לסקריפטי ההתקנה
        run: for f in deploy/*.sh; do [ -e "$f" ] || continue; bash -n "$f"; done

  smoke:
    name: בדיקת עשן עם המודלים האמיתיים
    needs: test
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e server
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/fetch_models.py') }}
      - name: הורדת מודלים (עם אימות חתימה)
        run: python tools/fetch_models.py models
      - name: הרצה על תמונות אמיתיות
        run: python tools/engine_smoke.py --models models
