name: DNS חי — תיקון YouTube והסתרת תמונות Spotify

on:
  push:
    branches: [main]
    paths:
      - "ops/dns-hotfix/trigger.json"

permissions:
  contents: read

concurrency:
  group: filterphone-live-dns-hotfix
  cancel-in-progress: false

jobs:
  apply:
    name: בדיקות, גיבוי והחלת DNS בשרת החי
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SERVER: ubuntu@151.145.88.42
      PUBLIC: https://api.filterphone.com

    steps:
      - name: הורדת המאגר
        uses: actions/checkout@v4

      - name: אימות בקשת התיקון
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/dns-hotfix/trigger.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("action") == "remove-youtube-blocks-globally", "Unexpected hotfix action"
          print("Verified the fixed DNS hotfix request.")
          PY

      - name: בדיקות שרת לפני פריסה
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: התקנה ובדיקות לפני שינוי שרת
        run: |
          pip install -e "server[dev]"
          ruff check server/filterphone server/tests
          ruff check tools --config server/pyproject.toml --ignore E702,E741
          pytest -q server/tests

      - name: הגדרת מפתח SSH מוגבל
        env:
          KEY: ${{ secrets.FP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FP_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing FP_DEPLOY_KEY or FP_DEPLOY_KNOWN_HOSTS; server was not changed."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: תיעוד מצב השרת לפני השינוי
        run: ssh -o BatchMode=yes "$SERVER" status

      - name: פריסת קוד השרת שנבדק
        run: |
          tar -czf - --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' server tools deploy \
            | ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" "deploy ${GITHUB_SHA::7}"

      - name: תיקון DNS חי ואימות כללים
        run: ssh -o BatchMode=yes -o ServerAliveInterval=30 "$SERVER" dns-hotfix

      - name: בדיקות אחרי התיקון
        run: |
          curl -fsS --retry 5 --retry-delay 3 "$PUBLIC/health"
          curl -fsS "$PUBLIC/v1/catalog" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["levels"] and d["options"]; assert not any(o.get("id") == "youtube" for o in d["options"]), "YouTube must not be offered as a block option"; print("catalog:", len(d["options"]), "options; YouTube block option absent")'

      - name: מצב סופי
        if: always()
        run: ssh -o BatchMode=yes "$SERVER" status || true

      - name: ניקוי מפתח SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519
